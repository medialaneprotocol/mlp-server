[package]
name = "mlp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Reference WebSocket server for the Media Lane Protocol (MLP)."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/medialaneprotocol/mlp-server"
publish = false

[dependencies]
mlp-core = { git = "https://github.com/medialaneprotocol/mlp-core", rev = "fd929ded6a0c0448ba9d23df12228d9f6ec2961b" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
